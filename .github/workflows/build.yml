name: 앱 제작

on:
  push:
    branches: [ main ]
  schedule:
    # 매일 오후 5시 37분(한국 시각)에 맛집 자료를 새로 모은다 — 유튜브 하루 사용량이 오후 5시에 새로 채워지므로 그 직후
    - cron: '37 8 * * *'
  workflow_dispatch:
    inputs:
      areas:
        description: '이번에 모을 동네 (쉼표로, 비우면 전부)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 맛집 자료 모으기
        timeout-minutes: 45
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          AREAS: ${{ inputs.areas }}
        run: python3 -u collector/collect.py

      - name: 모은 자료 저장
        run: |
          git config user.name "df-app-lab"
          git config user.email "dfmail@naver.com"
          git add -f web/data/*.json collector/*.json
          git commit -m "맛집 자료 갱신" || exit 0
          git pull --rebase origin main
          git push

  # 크롬 미리보기: 화면 코드가 그대로면 지난번에 만든 화면을 꺼내 자료만 바꿔 끼운다 (1분 안팎)
  web:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 지난번 화면 꺼내기
        id: webcache
        uses: actions/cache@v6
        with:
          path: build/web
          key: web-${{ hashFiles('lib/**', 'pubspec.yaml', 'assets/**', 'tool/**', 'web/flutter_bootstrap.js', '.github/workflows/build.yml') }}

      - name: 플러터 준비
        if: steps.webcache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 크롬 미리보기 만들기
        if: steps.webcache.outputs.cache-hit != 'true'
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms web .
          sed -i 's#<title>.*</title>#<title>콕플 – 유튜브 맛집 지도</title>#' web/index.html
          flutter pub get
          flutter build web --release --base-href /df-app-lab/

      - name: 최신 맛집 자료 넣기
        run: |
          mkdir -p build/web/data build/web/policy
          cp web/data/*.json build/web/data/
          cp web/policy/*.html build/web/policy/

      - name: 새 화면이 바로 보이게 (판 번호 찍기)
        run: python3 tool/stamp_web.py ${{ github.run_id }}

      - name: 미리보기 게시 준비
        uses: actions/configure-pages@v6

      - name: 크롬 미리보기 올리기
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: web
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 크롬 미리보기 게시
        id: deployment
        uses: actions/deploy-pages@v5

  # 안드로이드 설치 파일: 앱 화면 코드를 바꿨을 때만 만든다 (자료는 앱이 인터넷에서 받아 오므로 다시 만들 필요 없음)
  apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 자바 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 그래들 보관분 꺼내기
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-

      - name: 빠진 기본 파일 채우기
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms android,web .
          python3 tool/patch_android.py "콕플"

      - name: 안드로이드 설치 파일 만들기
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk df-app-lab.apk

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: df-app-lab.apk

      - name: 설치 파일 고정 링크로 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest df-app-lab.apk --title "최신 시험 앱" --notes "제작 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" --target $(git rev-parse HEAD)
