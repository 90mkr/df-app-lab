name: 앱 제작

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 자바 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 앱 코드가 없으면 시험용 예제 앱 만들기
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --org kr.designfeel --project-name df_app_lab --platforms android,web .
          fi

      - name: 패키지 받기
        run: flutter pub get

      - name: 안드로이드 설치 파일 만들기
        run: flutter build apk --release

      - name: 크롬 미리보기 만들기
        run: flutter build web --release --base-href /df-app-lab/

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 미리보기 게시 준비
        uses: actions/configure-pages@v6

      - name: 크롬 미리보기 올리기
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 크롬 미리보기 게시
        id: deployment
        uses: actions/deploy-pages@v5
