name: 앱 제작

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 자바 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 앱 코드가 없으면 시험용 예제 앱 만들기
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --org kr.designfeel --project-name df_app_lab --platforms android,web .
          fi

      - name: 패키지 받기
        run: flutter pub get

      - name: 안드로이드 설치 파일 만들기
        run: flutter build apk --release

      - name: 크롬 미리보기 만들기
        run: flutter build web --release --base-href /

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 크롬 미리보기 올리기
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web
