name: 앱 제작

on:
  push:
    branches: [ main ]
  schedule:
    # 매일 오후 5시 37분(한국 시각)에 맛집 자료를 새로 모은다 — 유튜브 하루 사용량이 오후 5시에 새로 채워지므로 그 직후
    - cron: '37 8 * * *'
    # 동네를 빨리 넓히는 동안 하루 두 번 더 (구글 조회는 상한 안에서만 — 다 쓰면 그냥 넘어감)
    - cron: '17 1 * * *'
    - cron: '47 13 * * *'
  workflow_dispatch:
    inputs:
      areas:
        description: '이번에 모을 동네 (쉼표로, 비우면 전부)'
        required: false
        default: ''
      follow_only:
        description: '유튜버 따라가기만 모으기 (동네 자료는 그대로)'
        type: boolean
        required: false
        default: false
      follow_debug:
        description: '따라가기 점검 (이름|주소;이름|주소 — 넣으면 점검만 하고 저장 안 함)'
        required: false
        default: ''
      pick_only:
        description: '쯔양 등 영상 가게 후보만 뽑기'
        type: boolean
        required: false
        default: false
      collect_only:
        description: '동네 맛집 자료만 모으기 (유튜버·후보 뽑기 건너뜀)'
        type: boolean
        required: false
        default: false
      pick_max:
        description: '이번에 AI로 볼 영상 수'
        required: false
        default: '120'
      google_max:
        description: '이미 연 동네마다 이번에 새로 볼 구글 조회 수 (비우면 30, 0이면 저장된 자료로 순위만 다시)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 유튜버 따라가기 모으기
        if: ${{ !inputs.pick_only && !inputs.collect_only }}
        timeout-minutes: 40
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          FOLLOW_MIN: '30'
          FOLLOW_DEBUG: ${{ inputs.follow_debug }}
        run: python3 -u collector/follow.py

      - name: 쯔양 등 영상에서 가게 후보 뽑기
        if: ${{ !inputs.collect_only }}
        timeout-minutes: 40
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PICK_MAX: ${{ inputs.pick_max }}
        run: python3 -u collector/pick.py

      - name: 다음 동네 정하기 (인천 → 서울 → 경기 → 큰 도시 순, 구글 무료량이 남을 때만)
        if: ${{ !inputs.follow_only && !inputs.pick_only && !inputs.areas }}
        continue-on-error: true
        run: python3 -u collector/auto_areas.py

      - name: 맛집 자료 모으기
        if: ${{ !inputs.follow_only && !inputs.pick_only }}
        timeout-minutes: 300
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          AREAS: ${{ inputs.areas }}
          GOOGLE_MAX: ${{ inputs.google_max }}
        run: python3 -u collector/collect.py

      - name: 후기 모음 (지금도 맛있다 투표·추천 메뉴)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -u collector/review_stats.py

      - name: 지역 수집 진행 상황 적기 (관리자 화면 「지역 수집」)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -u collector/auto_areas.py --report

      - name: 모은 자료 저장
        # 수집이 시간 제한으로 끊겨도 그때까지 모은 동네와 구글 사용 횟수는 꼭 저장 (안 그러면 다음 수집이 쓴 만큼을 모름)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "df-app-lab"
          git config user.email "dfmail@naver.com"
          git add -f web/data/*.json collector/*.json
          git commit -m "맛집 자료 갱신" || exit 0
          git pull --rebase origin main
          git push

  # 크롬 미리보기: 화면 코드가 그대로면 지난번에 만든 화면을 꺼내 자료만 바꿔 끼운다 (1분 안팎)
  web:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 지난번 화면 꺼내기
        id: webcache
        uses: actions/cache@v6
        with:
          path: build/web
          key: web-${{ hashFiles('lib/**', 'pubspec.yaml', 'assets/**', 'tool/**', 'web/flutter_bootstrap.js', '.github/workflows/build.yml') }}

      - name: 플러터 준비
        if: steps.webcache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 크롬 미리보기 만들기
        if: steps.webcache.outputs.cache-hit != 'true'
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms web .
          sed -i 's#<title>.*</title>#<title>콕플 – 유튜브 맛집 지도</title>#' web/index.html
          python3 tool/brand.py web
          flutter pub get
          flutter build web --release --base-href /df-app-lab/

      - name: 최신 맛집 자료 넣기
        run: |
          mkdir -p build/web/data build/web/policy
          cp web/data/*.json build/web/data/
          cp web/policy/*.html build/web/policy/

      - name: 새 화면이 바로 보이게 (판 번호 찍기)
        run: python3 tool/stamp_web.py ${{ github.run_id }}

      - name: 미리보기 게시 준비
        uses: actions/configure-pages@v6

      - name: 크롬 미리보기 올리기
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: web
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 크롬 미리보기 게시
        id: deployment
        uses: actions/deploy-pages@v5

  # 안드로이드 설치 파일: 앱 화면 코드를 바꿨을 때만 만든다 (자료는 앱이 인터넷에서 받아 오므로 다시 만들 필요 없음)
  apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 자바 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 고정 서명 키: 대표님이 깃허브 비밀(ANDROID_KEY_PASS)에 직접 정한 비밀번호로 잠가 저장소에 둔다
      # 처음 한 번은 여기서 새로 만들어 잠근 파일을 올리고, 다음부터는 그 파일을 풀어 쓴다 (비밀번호는 어디에도 안 남음)
      - name: 앱 서명 키 준비
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          K="$RUNNER_TEMP/upload.jks"
          # 앞선 제작이 막 만든 키가 있으면 그걸 쓴다 (같은 키를 두 번 만들지 않게)
          git fetch -q origin main && git checkout origin/main -- tool/upload.jks.enc 2>/dev/null || true
          if [ -z "$KEY_PASS" ]; then
            echo "서명 키 비밀번호(ANDROID_KEY_PASS)가 아직 없어 임시 서명으로 만듭니다"
          elif [ -f tool/upload.jks.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tool/upload.jks.enc -out "$K" -pass env:KEY_PASS 2>/dev/null; then
              echo "고정 서명 키로 만듭니다"
            else
              # 키를 새로 만들어 덮으면 앱 지문이 바뀌어 구글 로그인·업데이트가 깨진다 — 멈추고 알린다
              echo "::error::서명 키 비밀번호(ANDROID_KEY_PASS)가 처음 정한 것과 달라 서명 키를 열지 못했습니다. 깃허브 비밀을 처음 비밀번호로 되돌려 주세요."
              exit 1
            fi
          else
            rm -f "$K"
            keytool -genkeypair -keystore "$K" -alias kokple -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=Kokple, O=Designfeel, L=Incheon, C=KR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$K" -out tool/upload.jks.enc -pass env:KEY_PASS
            git config user.name "df-app-lab"
            git config user.email "dfmail@naver.com"
            git add tool/upload.jks.enc
            git commit -m "앱 서명 키 처음 만듦 (잠근 파일) [skip ci]"
            git pull --rebase origin main && git push
            echo "고정 서명 키를 새로 만들었습니다"
          fi

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 그래들 보관분 꺼내기
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-

      - name: 빠진 기본 파일 채우기
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms android,web .
          python3 tool/patch_android.py "콕플"
          python3 tool/brand.py android

      - name: 앱 서명 키 넣기
        run: |
          if [ -f "$RUNNER_TEMP/upload.jks" ]; then cp "$RUNNER_TEMP/upload.jks" android/app/upload.jks; fi

      - name: 안드로이드 설치 파일 만들기
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk df-app-lab.apk
          cp df-app-lab.apk kokple.apk  # 받는 파일 이름도 앱 이름으로 (예전 링크도 계속 되게 둘 다 올림)
          # 앱 지문 (파이어베이스·카카오에 등록하는 값 — 공개해도 되는 값)
          if [ -f android/app/upload.jks ]; then keytool -list -v -keystore android/app/upload.jks -storepass "$KEY_PASS" -alias kokple | grep -E "SHA1|SHA256" || true; fi

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            df-app-lab.apk
            kokple.apk

      - name: 설치 파일 고정 링크로 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 지웠다 다시 만들지 않고 파일만 바꿔 끼운다 (중간에 링크가 끊기지 않게)
          NOTE="제작 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest df-app-lab.apk kokple.apk --clobber
            gh release edit latest --notes "$NOTE" --title "콕플 최신 앱" || true
          else
            gh release create latest df-app-lab.apk kokple.apk --title "콕플 최신 앱" --notes "$NOTE" --target main
          fi
