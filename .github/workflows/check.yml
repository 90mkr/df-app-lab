name: 코드 점검

# 김부장이 만드는 중인 코드를 배포 없이 미리 검사하는 곳 (check 갈래에 올리면 화면 코드만 맞춰 봄)
on:
  push:
    branches: [ check ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 코드 검사
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms android,web . > /dev/null
          flutter pub get > /dev/null
          flutter analyze --no-fatal-infos --no-fatal-warnings lib
