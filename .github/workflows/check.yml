name: 코드 점검

# 김부장이 만드는 중인 코드를 배포 없이 미리 검사하는 곳 (check 갈래에 올리면 화면 코드만 맞춰 봄)
on:
  push:
    branches: [ check ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 코드 검사
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms android,web . > /dev/null
          flutter pub get > /dev/null
          flutter analyze --no-fatal-infos --no-fatal-warnings lib

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 파이어베이스 규칙 시험 (가짜 저장소)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p /tmp/rt && cp firestore.rules tool/rules_test.mjs /tmp/rt/ && cd /tmp/rt
          echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase.json
          npm init -y > /dev/null
          npm i --silent firebase-tools @firebase/rules-unit-testing firebase > /dev/null 2>&1
          npx firebase emulators:exec --only firestore --project demo-kokple "node rules_test.mjs" 2>&1 | grep -v "^i \|^⚠\|^\s*$" | tail -80
          test "${PIPESTATUS[0]}" = 0

  # 커밋 글에 [화면]이 있으면: 웹을 만들어 이 컴퓨터 안에서 띄우고 후기 화면을 찍어 shots-check 갈래에 올림 (배포 안 함)
  screens:
    if: contains(github.event.head_commit.message, '[화면')
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 플러터 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 웹 만들기
        run: |
          flutter create --org kr.designfeel --project-name df_app_lab --platforms web . > /dev/null
          python3 tool/brand.py web
          flutter pub get > /dev/null
          flutter build web --release --base-href /df-app-lab/
          mkdir -p build/web/data build/web/policy /tmp/site
          cp web/data/*.json build/web/data/
          cp web/policy/*.html build/web/policy/
          cp -r build/web /tmp/site/df-app-lab

      - name: 브라우저 준비
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null

      - name: 후기 화면 찍기
        run: |
          (cd /tmp/site && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          python .github/shot/${{ contains(github.event.head_commit.message, '[화면:테마]') && 'theme_shot' || contains(github.event.head_commit.message, '[화면:종류]') && 'cuisine_shot' || (contains(github.event.head_commit.message, '[화면:기능]') && 'feat_shot' || (contains(github.event.head_commit.message, '[화면:앱]') && 'app_shot' || 'review_shot')) }}.py "http://localhost:8765/df-app-lab/?demo=1" shots

      - name: 사진 올리기
        if: always()
        run: |
          cd shots
          git init -q -b shots-check
          git add -A
          git -c user.name="화면 확인" -c user.email="shot@users.noreply.github.com" commit -qm "후기 화면 점검 ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-check

  # 커밋 글에 [규칙확인]이 있으면: 실제 파이어베이스에 새 규칙이 게시됐는지 (후기 읽기가 열렸는지) 확인
  live_rules:
    if: contains(github.event.head_commit.message, '[규칙확인]')
    runs-on: ubuntu-latest
    steps:
      - name: 후기 읽기 시험
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/kokple/databases/(default)/documents/reviews?pageSize=1&key=AIzaSyCtAYeMr_86li7WmmkXUL6Nx0ae8xmG5ME")
          echo "후기 읽기 응답: $code"
          head -c 300 out.json; echo
          code2=$(curl -s -o out2.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/kokple/databases/(default)/documents/reports?pageSize=1&key=AIzaSyCtAYeMr_86li7WmmkXUL6Nx0ae8xmG5ME")
          echo "신고 몰래 읽기 응답(막혀야 정상 403): $code2"
          code3=$(curl -s -o out3.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/kokple/databases/(default)/documents/regionViews?pageSize=1&key=AIzaSyCtAYeMr_86li7WmmkXUL6Nx0ae8xmG5ME")
          echo "많이 본 지역 읽기 응답(새 규칙이면 200): $code3"
          test "$code" = 200 && test "$code2" = 403 && test "$code3" = 200
