name: 유튜버 채널 확인

# 유명 유튜버 따라가기 — 채널 후보를 유튜브 공식 연동으로 한 번 확인해 본다 (구독자·주소 적힌 비율)
on:
  workflow_dispatch:
    inputs:
      max_search:
        description: '이름 검색 최대 횟수 (한 번에 100씩 씀)'
        required: false
        default: '25'
      discover:
        description: '채널 찾아보기 검색어 (쉼표로)'
        required: false
        default: ''
      samples:
        description: '주소 앞뒤 글 보기 (핸들, 쉼표로)'
        required: false
        default: ''
      probe:
        description: '주인 댓글 확인할 핸들 (쉼표로, 비우면 채널 확인)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
      - name: 채널 확인
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          MAX_SEARCH: ${{ inputs.max_search }}
          PROBE: ${{ inputs.probe }}
          DISCOVER: ${{ inputs.discover }}
          SAMPLES: ${{ inputs.samples }}
        run: python3 -u collector/yt_check.py
