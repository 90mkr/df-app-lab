name: 화면 확인

# 김부장이 화면을 직접 볼 수 없어서, 올라간 앱을 휴대폰 크기 브라우저로 열어 사진을 찍어 둔다 (shots 갈래에 저장)
on:
  workflow_dispatch:
    inputs:
      url:
        description: '열어 볼 주소'
        required: false
        default: 'https://90mkr.github.io/df-app-lab/'

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
      - name: 파이썬
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 브라우저 준비
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: 화면 찍기
        run: python .github/shot/shot.py "${{ inputs.url }}" shots
      - name: 사진 올리기
        if: always()
        run: |
          cd shots
          git init -q -b shots
          git add -A
          git -c user.name="화면 확인" -c user.email="shot@users.noreply.github.com" commit -qm "화면 확인 ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
